name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Install libmpv
        run: brew install mpv
      - name: Build app
        run: chmod +x Scripts/build-app.sh && Scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-app
          path: dist/Lumora.app
